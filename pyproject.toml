[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-vibe-coding"
version = "1.0.0"
description = "Autonomous Multi-Agent Software Development Agency on Antigravity 2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic[email]>=2.8.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.3",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[project.scripts]
vibe = "vibe:main"

[tool.setuptools]
py-modules = ["vibe"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/backend/tests", "src/db/tests", "tests"]
pythonpath = [".", "src"]
addopts = "-v --tb=short"
markers = [
    "asyncio: mark test as asyncio coroutine",
    "anyio: mark test to run with anyio",
    "postgres_only: mark test as requiring a live PostgreSQL instance (e.g. for pgvector, tsvector, array operators)",
    "sqlite_compatible: mark test as compatible with both SQLite in-memory and PostgreSQL",
]

[tool.coverage.run]
source = ["src/backend", "src/db/models"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/migration_manager.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "except ImportError:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
exclude = ["node_modules", ".venv", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function call in argument defaults (standard for FastAPI Depends)
]
