# A generic, single database configuration with asyncpg support for AI-Vibe-Coding.
# NOTE for Cloud PostgreSQL / Supabase:
# - Run migrations with DIRECT_DATABASE_URL (Port 5432, Session Mode DDL & session locks).
# - Application runtime uses DATABASE_URL (Port 6543, Supavisor Transaction Pooler with prepared_statement_cache_size=0).

[alembic]
# path to migration scripts
script_location = src/db/migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# max length of characters to apply to the "slug" field (avoids MAX_PATH limits on Windows)
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a source .py file to be detected as revisions
sourceless = false

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = src

# timezone to use when rendering the date within the migration file
# as well as the filename.
timezone = UTC

# version path separator
version_path_separator = os

sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/vibe_db

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
